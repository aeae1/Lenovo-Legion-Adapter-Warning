name: Verify and publish V4 internal deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-assets/Lenovo-GKCN65WW-V4-Internal-Deployment-1.zip
      - deployment/internal-1/**
      - scripts/check-internal-shell.py
      - scripts/package-internal.py
      - .github/workflows/publish-internal.yml
permissions:
  contents: read
concurrency:
  group: publish-internal-v4-1
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify explicit archive contents
        run: python3 scripts/package-internal.py --check
      - name: Install UEFI emulator and disposable disk-image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf mtools dosfstools
      - name: Check deployment scripts in an isolated UEFI Shell
        run: python3 scripts/check-internal-shell.py
  publish:
    needs: [verify, shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish once without replacing existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = aeae1/Lenovo-Legion-Adapter-Warning
          test "$(gh api "repos/$GH_REPO" --jq '.private')" = false
          (cd release-assets && sha256sum --check SHA256SUMS-v4-internal-1.txt)
          if gh release view v4-internal-1 >/dev/null 2>&1; then
            echo "Internal deployment release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v4-internal-1 \
            release-assets/Lenovo-GKCN65WW-V4-Internal-Deployment-1.zip \
            release-assets/SHA256SUMS-v4-internal-1.txt \
            --target "$GITHUB_SHA" \
            --title "V4 - internal-drive deployment, revision 1" \
            --notes-file docs/releases/v4-internal-1.md \
            --prerelease --latest=false
